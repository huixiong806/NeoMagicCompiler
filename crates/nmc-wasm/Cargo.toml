[package]
name = "nmc-wasm"
version = "0.1.0"
edition = "2021"
description = "Neo Magic Compiler 浏览器内置引擎（WASM 薄适配层）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neomagic-core = { path = "../neomagic-core", features = ["embedded-content"] }
riscv-simulator = { path = "../riscv-simulator" }
starlang = { path = "../starlang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
